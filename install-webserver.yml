---
- hosts: web
  become: yes

  tasks:
    - name: Install Apache
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Start Apache
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Create index page
      copy:
        content: |
          <html>
          <body>
          <h1>Ayush Hira Lal Kewat</h1>
          <h2>Ansible Project Successful</h2>
          </body>
          </html>
        dest: /var/www/html/index.html
